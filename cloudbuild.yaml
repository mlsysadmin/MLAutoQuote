# Build and deploy M Lhuillier AutoQuote to Cloud Run.
#
#   gcloud builds submit --config cloudbuild.yaml \
#     --substitutions=_REGION=asia-southeast1,_SERVICE=ml-autoquote,_INSTANCE=PROJECT:REGION:INSTANCE
#
# Secrets (DATABASE_URL, SESSION_SECRET, …) are set once on the service with
# `gcloud run services update --set-secrets` and are not referenced here, so
# this file is safe to commit.

substitutions:
  _REGION: asia-southeast1
  _SERVICE: ml-autoquote
  _REPO: ml-autoquote
  _INSTANCE: "" # Cloud SQL connection name: PROJECT:REGION:INSTANCE

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: E2_HIGHCPU_8

images:
  - "${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/${_SERVICE}:${SHORT_SHA}"
  - "${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/${_SERVICE}:latest"

steps:
  # Pull the previous image so Docker can reuse its layers.
  - id: pull-cache
    name: gcr.io/cloud-builders/docker
    entrypoint: bash
    args:
      - -c
      - |
        docker pull "${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/${_SERVICE}:latest" || true

  - id: build
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - --cache-from
      - "${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/${_SERVICE}:latest"
      - -t
      - "${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/${_SERVICE}:${SHORT_SHA}"
      - -t
      - "${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/${_SERVICE}:latest"
      - .

  - id: push
    name: gcr.io/cloud-builders/docker
    args:
      - push
      - --all-tags
      - "${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/${_SERVICE}"

  - id: deploy
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - deploy
      - "${_SERVICE}"
      - --image=${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/${_SERVICE}:${SHORT_SHA}
      - --region=${_REGION}
      - --platform=managed
      - --allow-unauthenticated
      - --port=8080
      # Cold starts land on a customer mid-form, so keep one instance warm and
      # give every instance the CPU boost during start-up.
      - --min-instances=1
      - --max-instances=20
      - --concurrency=80
      - --cpu=1
      - --memory=1Gi
      - --cpu-boost
      - --timeout=60
      - --add-cloudsql-instances=${_INSTANCE}

timeout: 1800s
